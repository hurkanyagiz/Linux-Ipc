<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title">
  <title id="title">Socket mechanism — TCP lifecycle</title>
  <defs>
    <style>
      .bg{fill:#ffffff}
      .client{fill:#ecfeff;stroke:#06b6d4;stroke-width:1.5}
      .server{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}
      .step{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.2}
      .label-bg{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}
      .h1{font:700 22px 'Segoe UI',system-ui,sans-serif;fill:#0f172a}
      .h2{font:600 16px 'Segoe UI',system-ui,sans-serif;fill:#1e293b}
      .t{font:500 13px 'Segoe UI',system-ui,sans-serif;fill:#475569}
      .code{font:600 13px 'Cascadia Code','Fira Code',monospace;fill:#6366f1}
      .syn{font:700 13px 'Segoe UI',system-ui,sans-serif;fill:#059669}
      .data{font:700 13px 'Segoe UI',system-ui,sans-serif;fill:#7c3aed}
      .fin{font:700 13px 'Segoe UI',system-ui,sans-serif;fill:#dc2626}
      .line{stroke:#64748b;stroke-width:1.5;fill:none}
      .syn-line{stroke:#22c55e;stroke-width:2;fill:none}
      .data-line{stroke:#8b5cf6;stroke-width:2.5;fill:none}
      .fin-line{stroke:#ef4444;stroke-width:1.5;fill:none}
      .arrow{fill:#64748b}
      .syn-arrow{fill:#22c55e}
      .data-arrow{fill:#8b5cf6}
      .fin-arrow{fill:#ef4444}
      .timeline{stroke:#e2e8f0;stroke-width:1;stroke-dasharray:4 3}
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7z" class="arrow"/></marker>
    <marker id="sa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7z" class="syn-arrow"/></marker>
    <marker id="da" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7z" class="data-arrow"/></marker>
    <marker id="fa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7z" class="fin-arrow"/></marker>
  </defs>
  <rect class="bg" width="900" height="480" rx="16"/>

  <text x="40" y="38" class="h1">TCP socket lifecycle</text>
  <text x="310" y="38" class="t">three-way handshake → data exchange → teardown</text>

  <!-- Client header -->
  <rect x="80" y="60" width="140" height="44" rx="10" class="client"/>
  <text x="150" y="88" text-anchor="middle" class="h2">Client</text>

  <!-- Server header -->
  <rect x="620" y="60" width="140" height="44" rx="10" class="server"/>
  <text x="690" y="88" text-anchor="middle" class="h2">Server</text>

  <!-- Timelines -->
  <line x1="150" y1="104" x2="150" y2="450" class="timeline"/>
  <line x1="690" y1="104" x2="690" y2="450" class="timeline"/>

  <!-- Server setup -->
  <rect x="630" y="116" width="120" height="26" rx="6" class="step"/>
  <text x="690" y="134" text-anchor="middle" class="code">socket()</text>
  <rect x="630" y="148" width="120" height="26" rx="6" class="step"/>
  <text x="690" y="166" text-anchor="middle" class="code">bind()</text>
  <rect x="630" y="180" width="120" height="26" rx="6" class="step"/>
  <text x="690" y="198" text-anchor="middle" class="code">listen()</text>

  <!-- Client setup -->
  <rect x="90" y="116" width="120" height="26" rx="6" class="step"/>
  <text x="150" y="134" text-anchor="middle" class="code">socket()</text>

  <!-- Three-way handshake -->
  <text x="420" y="240" text-anchor="middle" class="h2" style="fill:#059669">Three-way handshake</text>

  <path d="M160,260 L680,275" class="syn-line" marker-end="url(#sa)"/>
  <text x="420" y="258" text-anchor="middle" class="syn">SYN</text>

  <path d="M680,295 L160,310" class="syn-line" marker-end="url(#sa)"/>
  <text x="420" y="297" text-anchor="middle" class="syn">SYN + ACK</text>

  <path d="M160,328 L680,343" class="syn-line" marker-end="url(#sa)"/>
  <text x="420" y="332" text-anchor="middle" class="syn">ACK</text>

  <rect x="90" y="252" width="54" height="22" rx="4" class="step"/>
  <text x="117" y="268" text-anchor="middle" class="t" style="font-size:11px">connect()</text>
  <rect x="700" y="288" width="54" height="22" rx="4" class="step"/>
  <text x="727" y="304" text-anchor="middle" class="t" style="font-size:11px">accept()</text>

  <!-- Data exchange -->
  <path d="M160,378 L680,378" class="data-line" marker-end="url(#da)" marker-start="url(#da)"/>
  <text x="420" y="370" text-anchor="middle" class="data">send() / recv() — full duplex</text>

  <!-- Teardown -->
  <path d="M160,418 L680,432" class="fin-line" marker-end="url(#fa)"/>
  <text x="420" y="416" text-anchor="middle" class="fin">FIN → close()</text>

  <!-- Labels -->
  <rect x="760" y="252" width="120" height="90" rx="10" class="label-bg"/>
  <text x="820" y="278" text-anchor="middle" class="t">AF_INET</text>
  <text x="820" y="298" text-anchor="middle" class="t">AF_INET6</text>
  <text x="820" y="318" text-anchor="middle" class="t">AF_UNIX</text>
  <text x="820" y="336" text-anchor="middle" class="code" style="font-size:11px">SOCK_STREAM</text>
</svg>
