<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Linux IPC banner</title>
  <desc id="desc">A banner showing Linux IPC mechanisms: Pipe, Message Queue, Shared Memory, Semaphore, Socket, and Signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .title{font:700 46px 'Segoe UI',Arial,sans-serif; fill:#f8fafc}
      .subtitle{font:400 21px 'Segoe UI',Arial,sans-serif; fill:#cbd5e1}
      .chip{fill:#0b1220; stroke:#334155; stroke-width:1.2}
      .chipText{font:600 18px 'Segoe UI',Arial,sans-serif; fill:#e2e8f0}
      .label{font:700 18px 'Segoe UI',Arial,sans-serif; fill:#e2e8f0}
      .small{font:500 15px 'Segoe UI',Arial,sans-serif; fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="34" y="34" width="1132" height="292" rx="22" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>

  <text x="56" y="98" class="title">Linux Inter-Process Communication</text>
  <text x="56" y="132" class="subtitle">A visual, code-first portfolio repository for understanding how Linux processes talk, coordinate, and synchronize.</text>

  <g transform="translate(56,178)">
    <rect class="chip" x="0" y="0" rx="18" width="142" height="54"/>
    <text class="chipText" x="71" y="34" text-anchor="middle">Pipe / FIFO</text>

    <rect class="chip" x="158" y="0" rx="18" width="178" height="54"/>
    <text class="chipText" x="247" y="34" text-anchor="middle">Message Queue</text>

    <rect class="chip" x="352" y="0" rx="18" width="186" height="54"/>
    <text class="chipText" x="445" y="34" text-anchor="middle">Shared Memory</text>

    <rect class="chip" x="554" y="0" rx="18" width="160" height="54"/>
    <text class="chipText" x="634" y="34" text-anchor="middle">Semaphore</text>

    <rect class="chip" x="730" y="0" rx="18" width="122" height="54"/>
    <text class="chipText" x="791" y="34" text-anchor="middle">Socket</text>

    <rect class="chip" x="868" y="0" rx="18" width="118" height="54"/>
    <text class="chipText" x="927" y="34" text-anchor="middle">Signal</text>
  </g>

  <g transform="translate(60,262)">
    <circle cx="22" cy="18" r="8" fill="#38bdf8"/>
    <text x="40" y="23" class="label">Communication</text>
    <text x="184" y="23" class="small">Streams, messages, request/response, local and remote data exchange</text>

    <circle cx="22" cy="56" r="8" fill="#a78bfa"/>
    <text x="40" y="61" class="label">Coordination</text>
    <text x="160" y="61" class="small">Mutual exclusion, event notification, lifecycle control, shared-state protection</text>
  </g>
</svg>
