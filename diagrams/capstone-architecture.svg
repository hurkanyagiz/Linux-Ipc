<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title">
  <title id="title">Capstone project — distributed task manager architecture</title>
  <defs>
    <style>
      .bg{fill:#ffffff}
      .client{fill:#ecfeff;stroke:#06b6d4;stroke-width:1.5}
      .disp{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}
      .worker{fill:#ecfdf5;stroke:#22c55e;stroke-width:1.5}
      .shm{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.8}
      .mq{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
      .sig{fill:#fee2e2;stroke:#ef4444;stroke-width:1.2}
      .sock{fill:#dbeafe;stroke:#3b82f6;stroke-width:1.2}
      .sem{fill:#faf5ff;stroke:#a78bfa;stroke-width:1.2}
      .tag{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}
      .h1{font:700 22px 'Segoe UI',system-ui,sans-serif;fill:#0f172a}
      .h2{font:600 16px 'Segoe UI',system-ui,sans-serif;fill:#1e293b}
      .t{font:500 13px 'Segoe UI',system-ui,sans-serif;fill:#475569}
      .code{font:600 12px 'Cascadia Code','Fira Code',monospace;fill:#6366f1}
      .line{stroke:#64748b;stroke-width:2;fill:none}
      .mq-line{stroke:#3b82f6;stroke-width:2;fill:none}
      .shm-line{stroke:#f59e0b;stroke-width:1.5;fill:none}
      .sig-line{stroke:#ef4444;stroke-width:1.5;fill:none;stroke-dasharray:6 3}
      .arrow{fill:#64748b}
      .mq-arrow{fill:#3b82f6}
      .shm-arrow{fill:#f59e0b}
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7z" class="arrow"/></marker>
    <marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7z" class="mq-arrow"/></marker>
    <marker id="sha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7z" class="shm-arrow"/></marker>
  </defs>
  <rect class="bg" width="900" height="520" rx="16"/>

  <text x="40" y="38" class="h1">Capstone: distributed task manager</text>
  <text x="440" y="38" class="t">all six IPC methods in one system</text>

  <!-- Client -->
  <rect x="40" y="70" width="160" height="70" rx="12" class="client"/>
  <text x="120" y="100" text-anchor="middle" class="h2">Client (CLI)</text>
  <text x="120" y="122" text-anchor="middle" class="code">task_client</text>

  <!-- Socket label -->
  <rect x="216" y="82" width="64" height="24" rx="6" class="sock"/>
  <text x="248" y="100" text-anchor="middle" class="t" style="font-size:12px">Socket</text>

  <path d="M200,105 L298,105" class="line" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- Dispatcher -->
  <rect x="300" y="60" width="220" height="80" rx="14" class="disp"/>
  <text x="410" y="94" text-anchor="middle" class="h2">Dispatcher</text>
  <text x="410" y="118" text-anchor="middle" class="code">task_dispatcher</text>

  <!-- MQ label -->
  <rect x="370" y="158" width="80" height="24" rx="6" class="mq"/>
  <text x="410" y="176" text-anchor="middle" class="t" style="font-size:12px">Mqueue</text>

  <path d="M410,140 L410,198" class="mq-line" marker-end="url(#ma)"/>

  <!-- Workers row -->
  <rect x="100" y="200" width="160" height="70" rx="12" class="worker"/>
  <text x="180" y="230" text-anchor="middle" class="h2">Worker 1</text>
  <text x="180" y="252" text-anchor="middle" class="code">task_worker 1</text>

  <rect x="310" y="200" width="160" height="70" rx="12" class="worker"/>
  <text x="390" y="230" text-anchor="middle" class="h2">Worker 2</text>
  <text x="390" y="252" text-anchor="middle" class="code">task_worker 2</text>

  <rect x="520" y="200" width="160" height="70" rx="12" class="worker"/>
  <text x="600" y="230" text-anchor="middle" class="h2">Worker 3</text>
  <text x="600" y="252" text-anchor="middle" class="code">task_worker 3</text>

  <!-- MQ fan-out -->
  <path d="M340,195 L180,200" class="mq-line" marker-end="url(#ma)"/>
  <path d="M480,195 L600,200" class="mq-line" marker-end="url(#ma)"/>

  <!-- Shared Memory -->
  <rect x="140" y="330" width="520" height="80" rx="14" class="shm"/>
  <text x="400" y="360" text-anchor="middle" class="h2">Shared memory — status table</text>
  <text x="400" y="384" text-anchor="middle" class="t">Task results • worker heartbeats • statistics</text>

  <!-- Semaphore -->
  <rect x="400" y="420" width="180" height="36" rx="8" class="sem"/>
  <text x="490" y="444" text-anchor="middle" class="h2" style="fill:#7c3aed">Semaphore protects access</text>

  <!-- SHM lines from workers -->
  <path d="M180,270 L240,330" class="shm-line" marker-end="url(#sha)"/>
  <path d="M390,270 L390,330" class="shm-line" marker-end="url(#sha)"/>
  <path d="M600,270 L560,330" class="shm-line" marker-end="url(#sha)"/>

  <!-- Signal notification -->
  <rect x="700" y="70" width="170" height="50" rx="10" class="sig"/>
  <text x="785" y="92" text-anchor="middle" class="h2" style="fill:#dc2626">SIGUSR1</text>
  <text x="785" y="110" text-anchor="middle" class="t">new task notification</text>

  <rect x="700" y="130" width="170" height="36" rx="8" class="sig"/>
  <text x="785" y="154" text-anchor="middle" class="t" style="fill:#dc2626">SIGTERM → graceful shutdown</text>

  <path d="M700,95 L520,95" class="sig-line"/>
  <path d="M700,148 L520,200" class="sig-line"/>

  <!-- Legend -->
  <line x1="40" y1="470" x2="860" y2="470" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="40"  y="482" width="70" height="24" rx="6" class="sock"/>
  <text x="75"  y="500" text-anchor="middle" class="t" style="font-size:11px">Socket</text>
  <rect x="120" y="482" width="70" height="24" rx="6" class="mq"/>
  <text x="155" y="500" text-anchor="middle" class="t" style="font-size:11px">Mqueue</text>
  <rect x="200" y="482" width="80" height="24" rx="6" class="shm"/>
  <text x="240" y="500" text-anchor="middle" class="t" style="font-size:11px">Shm</text>
  <rect x="290" y="482" width="90" height="24" rx="6" class="sem"/>
  <text x="335" y="500" text-anchor="middle" class="t" style="font-size:11px">Semaphore</text>
  <rect x="390" y="482" width="70" height="24" rx="6" class="sig"/>
  <text x="425" y="500" text-anchor="middle" class="t" style="font-size:11px">Signal</text>
</svg>
