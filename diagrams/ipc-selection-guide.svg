<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">IPC selection guide</title>
  <desc id="desc">A static decision tree for choosing among Linux IPC mechanisms.</desc>
  <defs>
    <style>
      .bg{fill:#ffffff}
      .q{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.8}
      .a{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .yes{fill:#ecfeff;stroke:#22d3ee;stroke-width:1.5}
      .no{fill:#fefce8;stroke:#facc15;stroke-width:1.5}
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .t{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .small{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .line{stroke:#64748b;stroke-width:2.2;fill:none}
      .tag{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#334155}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="900" rx="24"/>
  <text x="50" y="60" class="title">How to Choose an IPC Mechanism</text>
  <text x="50" y="90" class="subtitle">A practical decision tree for local services, data sharing, structured messages, and event notification.</text>

  <rect x="450" y="130" width="300" height="84" rx="18" class="q"/>
  <text x="600" y="178" text-anchor="middle" class="t">Do you need cross-host communication?</text>

  <rect x="820" y="250" width="250" height="84" rx="18" class="yes"/>
  <text x="945" y="285" text-anchor="middle" class="t">Socket</text>
  <text x="945" y="310" text-anchor="middle" class="small">TCP / UDP / network protocols</text>

  <rect x="365" y="270" width="470" height="84" rx="18" class="q"/>
  <text x="600" y="318" text-anchor="middle" class="t">Need one machine only. Do multiple processes share mutable state?</text>

  <rect x="160" y="405" width="340" height="94" rx="18" class="yes"/>
  <text x="330" y="445" text-anchor="middle" class="t">Shared Memory + Semaphore</text>
  <text x="330" y="472" text-anchor="middle" class="small">best throughput, but synchronization is mandatory</text>

  <rect x="600" y="405" width="460" height="84" rx="18" class="q"/>
  <text x="830" y="453" text-anchor="middle" class="t">No shared state. Do you need discrete messages?</text>

  <rect x="620" y="545" width="250" height="84" rx="18" class="yes"/>
  <text x="745" y="580" text-anchor="middle" class="t">Message Queue</text>
  <text x="745" y="605" text-anchor="middle" class="small">preserved message boundaries</text>

  <rect x="900" y="545" width="250" height="84" rx="18" class="q"/>
  <text x="1025" y="580" text-anchor="middle" class="t">Need only event notification?</text>
  <text x="1025" y="605" text-anchor="middle" class="small">lifecycle or wake-up signal</text>

  <rect x="860" y="690" width="190" height="84" rx="18" class="yes"/>
  <text x="955" y="726" text-anchor="middle" class="t">Signal</text>
  <text x="955" y="751" text-anchor="middle" class="small">tiny async event</text>

  <rect x="540" y="690" width="250" height="84" rx="18" class="no"/>
  <text x="665" y="726" text-anchor="middle" class="t">Pipe / FIFO</text>
  <text x="665" y="751" text-anchor="middle" class="small">simple local byte stream</text>

  <path d="M750 172 L860 250" class="line" marker-end="url(#arrow)"/>
  <text x="815" y="205" class="tag">Yes</text>

  <path d="M600 214 L600 270" class="line" marker-end="url(#arrow)"/>
  <text x="610" y="246" class="tag">No</text>

  <path d="M470 354 L350 405" class="line" marker-end="url(#arrow)"/>
  <text x="410" y="387" class="tag">Yes</text>

  <path d="M750 354 L830 405" class="line" marker-end="url(#arrow)"/>
  <text x="790" y="389" class="tag">No</text>

  <path d="M780 489 L745 545" class="line" marker-end="url(#arrow)"/>
  <text x="750" y="520" class="tag">Yes</text>

  <path d="M935 489 L1025 545" class="line" marker-end="url(#arrow)"/>
  <text x="982" y="518" class="tag">No / Maybe</text>

  <path d="M1000 629 L955 690" class="line" marker-end="url(#arrow)"/>
  <text x="960" y="660" class="tag">Yes</text>

  <path d="M960 629 L700 690" class="line" marker-end="url(#arrow)"/>
  <text x="815" y="665" class="tag">No</text>
</svg>
