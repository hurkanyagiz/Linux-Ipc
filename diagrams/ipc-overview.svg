<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Linux IPC overview diagram</title>
  <desc id="desc">A static diagram grouping Linux IPC into communication and synchronization families.</desc>
  <defs>
    <style>
      .bg{fill:#ffffff}
      .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .kernel{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.8}
      .sync{fill:#faf5ff;stroke:#c4b5fd;stroke-width:1.8}
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .h1{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
      .t{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#1e293b}
      .small{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .line{stroke:#64748b;stroke-width:2.2;fill:none}
      .dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;fill:none}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="760" rx="24"/>
  <text x="50" y="58" class="title">Linux IPC Overview</text>
  <text x="50" y="88" class="subtitle">Processes communicate through kernel-managed objects or shared mappings, and coordinate with synchronization primitives.</text>

  <rect x="60" y="140" width="240" height="120" rx="18" class="box"/>
  <text x="180" y="190" text-anchor="middle" class="h1">Process A</text>
  <text x="180" y="220" text-anchor="middle" class="small">private address space</text>

  <rect x="60" y="320" width="240" height="120" rx="18" class="box"/>
  <text x="180" y="370" text-anchor="middle" class="h1">Process B</text>
  <text x="180" y="400" text-anchor="middle" class="small">private address space</text>

  <rect x="60" y="500" width="240" height="120" rx="18" class="box"/>
  <text x="180" y="550" text-anchor="middle" class="h1">Process C</text>
  <text x="180" y="580" text-anchor="middle" class="small">private address space</text>

  <rect x="390" y="110" width="760" height="560" rx="26" class="kernel"/>
  <text x="770" y="154" text-anchor="middle" class="title" style="font-size:30px">Kernel / IPC Layer</text>

  <rect x="440" y="200" width="300" height="94" rx="18" class="box"/>
  <text x="590" y="236" text-anchor="middle" class="t">Pipe / FIFO</text>
  <text x="590" y="262" text-anchor="middle" class="small">byte stream • local only</text>

  <rect x="800" y="200" width="300" height="94" rx="18" class="box"/>
  <text x="950" y="236" text-anchor="middle" class="t">POSIX Message Queue</text>
  <text x="950" y="262" text-anchor="middle" class="small">message boundaries • priorities</text>

  <rect x="440" y="340" width="300" height="94" rx="18" class="box"/>
  <text x="590" y="376" text-anchor="middle" class="t">POSIX Shared Memory</text>
  <text x="590" y="402" text-anchor="middle" class="small">same physical pages mapped</text>

  <rect x="800" y="340" width="300" height="94" rx="18" class="sync"/>
  <text x="950" y="376" text-anchor="middle" class="t">POSIX Semaphore</text>
  <text x="950" y="402" text-anchor="middle" class="small">ordering • mutual exclusion</text>

  <rect x="440" y="480" width="300" height="94" rx="18" class="box"/>
  <text x="590" y="516" text-anchor="middle" class="t">Socket</text>
  <text x="590" y="542" text-anchor="middle" class="small">local or network • full duplex</text>

  <rect x="800" y="480" width="300" height="94" rx="18" class="sync"/>
  <text x="950" y="516" text-anchor="middle" class="t">Signal</text>
  <text x="950" y="542" text-anchor="middle" class="small">lightweight async notification</text>

  <path d="M300 200 L390 200" class="line" marker-end="url(#arrow)"/>
  <path d="M300 380 L390 380" class="line" marker-end="url(#arrow)"/>
  <path d="M300 560 L390 560" class="line" marker-end="url(#arrow)"/>

  <path d="M740 387 L800 387" class="dash" marker-end="url(#arrow)"/>
  <text x="770" y="374" text-anchor="middle" class="small">protects</text>

  <text x="590" y="620" text-anchor="middle" class="small">Communication families</text>
  <text x="950" y="620" text-anchor="middle" class="small">Coordination / notification families</text>
</svg>
