<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title">
  <title id="title">IPC comparison matrix</title>
  <defs>
    <style>
      .bg{fill:#ffffff}
      .header{fill:#f1f5f9}
      .row-even{fill:#fafafa}
      .row-odd{fill:#ffffff}
      .h1{font:700 22px 'Segoe UI',system-ui,sans-serif;fill:#0f172a}
      .th{font:600 13px 'Segoe UI',system-ui,sans-serif;fill:#64748b}
      .td{font:500 14px 'Segoe UI',system-ui,sans-serif;fill:#1e293b}
      .td-s{font:500 12px 'Segoe UI',system-ui,sans-serif;fill:#475569}
      .bar{rx:3;ry:3;height:8}
      .bar-fast{fill:#22c55e}
      .bar-med{fill:#f59e0b}
      .bar-slow{fill:#ef4444}
      .tag-yes{fill:#ecfdf5;stroke:#22c55e;stroke-width:1}
      .tag-no{fill:#fef2f2;stroke:#ef4444;stroke-width:1}
      .tag-t{font:600 11px 'Segoe UI',system-ui,sans-serif}
      .grid{stroke:#e2e8f0;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="900" height="380" rx="16"/>

  <text x="40" y="38" class="h1">IPC comparison matrix</text>

  <!-- Header row -->
  <rect x="30" y="56" width="840" height="34" rx="6" class="header"/>
  <text x="120" y="78" text-anchor="middle" class="th">METHOD</text>
  <text x="280" y="78" text-anchor="middle" class="th">SPEED</text>
  <text x="420" y="78" text-anchor="middle" class="th">COMPLEXITY</text>
  <text x="555" y="78" text-anchor="middle" class="th">NETWORK</text>
  <text x="680" y="78" text-anchor="middle" class="th">DATA CAPACITY</text>
  <text x="810" y="78" text-anchor="middle" class="th">DIRECTION</text>

  <!-- Row 1: Pipe -->
  <rect x="30" y="92" width="840" height="40" class="row-odd"/>
  <text x="120" y="118" text-anchor="middle" class="td">Pipe</text>
  <rect x="230" y="109" width="90" class="bar bar-fast"/>
  <rect x="380" y="109" width="25" class="bar bar-fast"/>
  <rect x="530" y="102" width="50" height="24" rx="4" class="tag-no"/>
  <text x="555" y="119" text-anchor="middle" class="tag-t" fill="#dc2626">Local</text>
  <text x="680" y="118" text-anchor="middle" class="td-s">64 KB buffer</text>
  <text x="810" y="118" text-anchor="middle" class="td-s">Unidirectional</text>

  <!-- Row 2: Message Queue -->
  <rect x="30" y="132" width="840" height="40" class="row-even"/>
  <text x="120" y="158" text-anchor="middle" class="td">Message Queue</text>
  <rect x="230" y="149" width="70" class="bar bar-med"/>
  <rect x="380" y="149" width="50" class="bar bar-med"/>
  <rect x="530" y="142" width="50" height="24" rx="4" class="tag-no"/>
  <text x="555" y="159" text-anchor="middle" class="tag-t" fill="#dc2626">Local</text>
  <text x="680" y="158" text-anchor="middle" class="td-s">~8 KB/msg</text>
  <text x="810" y="158" text-anchor="middle" class="td-s">Unidirectional</text>

  <!-- Row 3: Shared Memory -->
  <rect x="30" y="172" width="840" height="40" class="row-odd"/>
  <text x="120" y="198" text-anchor="middle" class="td">Shared Memory</text>
  <rect x="230" y="189" width="110" class="bar bar-fast"/>
  <rect x="380" y="189" width="80" class="bar bar-slow"/>
  <rect x="530" y="182" width="50" height="24" rx="4" class="tag-no"/>
  <text x="555" y="199" text-anchor="middle" class="tag-t" fill="#dc2626">Local</text>
  <text x="680" y="198" text-anchor="middle" class="td-s">Configurable</text>
  <text x="810" y="198" text-anchor="middle" class="td-s">Bidirectional</text>

  <!-- Row 4: Semaphore -->
  <rect x="30" y="212" width="840" height="40" class="row-even"/>
  <text x="120" y="238" text-anchor="middle" class="td">Semaphore</text>
  <rect x="230" y="229" width="100" class="bar bar-fast"/>
  <rect x="380" y="229" width="55" class="bar bar-med"/>
  <rect x="530" y="222" width="50" height="24" rx="4" class="tag-no"/>
  <text x="555" y="239" text-anchor="middle" class="tag-t" fill="#dc2626">Local</text>
  <text x="680" y="238" text-anchor="middle" class="td-s">N/A (sync only)</text>
  <text x="810" y="238" text-anchor="middle" class="td-s">N/A</text>

  <!-- Row 5: Socket -->
  <rect x="30" y="252" width="840" height="40" class="row-odd"/>
  <text x="120" y="278" text-anchor="middle" class="td">Socket</text>
  <rect x="230" y="269" width="50" class="bar bar-slow"/>
  <rect x="380" y="269" width="90" class="bar bar-slow"/>
  <rect x="530" y="262" width="50" height="24" rx="4" class="tag-yes"/>
  <text x="555" y="279" text-anchor="middle" class="tag-t" fill="#059669">Yes</text>
  <text x="680" y="278" text-anchor="middle" class="td-s">Unlimited</text>
  <text x="810" y="278" text-anchor="middle" class="td-s">Bidirectional</text>

  <!-- Row 6: Signal -->
  <rect x="30" y="292" width="840" height="40" class="row-even"/>
  <text x="120" y="318" text-anchor="middle" class="td">Signal</text>
  <rect x="230" y="309" width="105" class="bar bar-fast"/>
  <rect x="380" y="309" width="35" class="bar bar-fast"/>
  <rect x="530" y="302" width="50" height="24" rx="4" class="tag-no"/>
  <text x="555" y="319" text-anchor="middle" class="tag-t" fill="#dc2626">Local</text>
  <text x="680" y="318" text-anchor="middle" class="td-s">Signal # only</text>
  <text x="810" y="318" text-anchor="middle" class="td-s">Unidirectional</text>

  <!-- Legend -->
  <rect x="200" y="348" width="16" height="10" rx="3" class="bar-fast"/>
  <text x="222" y="358" class="td-s">Fast / Simple</text>
  <rect x="330" y="348" width="16" height="10" rx="3" class="bar-med"/>
  <text x="352" y="358" class="td-s">Moderate</text>
  <rect x="440" y="348" width="16" height="10" rx="3" class="bar-slow"/>
  <text x="462" y="358" class="td-s">Slow / Complex</text>
</svg>
