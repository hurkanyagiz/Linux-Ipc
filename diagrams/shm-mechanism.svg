<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title">
  <title id="title">POSIX Shared Memory mechanism</title>
  <defs>
    <style>
      .bg{fill:#ffffff}
      .vm{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
      .seg{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.2}
      .shm{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}
      .phys{fill:#ecfdf5;stroke:#22c55e;stroke-width:2}
      .warn{fill:#fef2f2;stroke:#ef4444;stroke-width:1.5}
      .h1{font:700 22px 'Segoe UI',system-ui,sans-serif;fill:#0f172a}
      .h2{font:600 16px 'Segoe UI',system-ui,sans-serif;fill:#1e293b}
      .t{font:500 13px 'Segoe UI',system-ui,sans-serif;fill:#475569}
      .code{font:600 13px 'Cascadia Code','Fira Code',monospace;fill:#6366f1}
      .wb{font:600 14px 'Segoe UI',system-ui,sans-serif;fill:#dc2626}
      .line{stroke:#64748b;stroke-width:2;fill:none}
      .shm-line{stroke:#f59e0b;stroke-width:2.5;fill:none}
      .arrow{fill:#64748b}
      .shm-arrow{fill:#f59e0b}
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7z" class="arrow"/>
    </marker>
    <marker id="sa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7z" class="shm-arrow"/>
    </marker>
  </defs>
  <rect class="bg" width="900" height="440" rx="16"/>

  <text x="40" y="38" class="h1">POSIX shared memory</text>
  <text x="310" y="38" class="t">zero-copy — fastest IPC for data exchange</text>

  <!-- Process A virtual memory -->
  <rect x="40" y="60" width="310" height="200" rx="14" class="vm"/>
  <text x="195" y="88" text-anchor="middle" class="h2">Process A — virtual memory</text>

  <rect x="60" y="104" width="270" height="34" rx="6" class="seg"/>
  <text x="195" y="126" text-anchor="middle" class="t">Code + Stack + Heap</text>

  <rect x="60" y="150" width="270" height="50" rx="8" class="shm"/>
  <text x="195" y="174" text-anchor="middle" class="h2">mmap() region</text>
  <text x="195" y="192" text-anchor="middle" class="code">shm_open + mmap</text>

  <!-- Process B virtual memory -->
  <rect x="550" y="60" width="310" height="200" rx="14" class="vm"/>
  <text x="705" y="88" text-anchor="middle" class="h2">Process B — virtual memory</text>

  <rect x="570" y="104" width="270" height="34" rx="6" class="seg"/>
  <text x="705" y="126" text-anchor="middle" class="t">Code + Stack + Heap</text>

  <rect x="570" y="150" width="270" height="50" rx="8" class="shm"/>
  <text x="705" y="174" text-anchor="middle" class="h2">mmap() region</text>
  <text x="705" y="192" text-anchor="middle" class="code">shm_open + mmap</text>

  <!-- Physical memory -->
  <rect x="220" y="340" width="460" height="70" rx="14" class="phys"/>
  <text x="450" y="370" text-anchor="middle" class="h2">Physical memory page</text>
  <text x="450" y="392" text-anchor="middle" class="t">/dev/shm/my_object — same physical bytes</text>

  <!-- Lines from mmap to physical -->
  <path d="M195,200 L350,340" class="shm-line" marker-end="url(#sa)"/>
  <path d="M705,200 L550,340" class="shm-line" marker-end="url(#sa)"/>

  <!-- Warning box -->
  <rect x="370" y="270" width="280" height="44" rx="10" class="warn"/>
  <text x="510" y="290" text-anchor="middle" class="wb">⚠ Requires synchronization</text>
  <text x="510" y="306" text-anchor="middle" class="t">semaphore or mutex mandatory</text>

  <!-- Zero-copy label -->
  <rect x="390" y="210" width="140" height="30" rx="8" fill="#ecfdf5" stroke="#22c55e" stroke-width="1.2"/>
  <text x="460" y="230" text-anchor="middle" class="h2" style="fill:#059669">Zero-copy</text>
</svg>
